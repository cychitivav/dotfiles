# --- Terminal -------------------------------------------------------------------------------------
set -g default-terminal "${TERM}"

# Undercurl and styled underlines
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# Colored underlines
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# --- General --------------------------------------------------------------------------------------
set -g  prefix2 C-a            # Secondary prefix (in addition to C-b)

set -s  escape-time 0          # No delay after pressing Esc
set -g  mouse on
set -g  set-clipboard on       # Copy to the system clipboard
set -g  mode-keys vi
set -g  detach-on-destroy off  # When a session closes, switch to another one

set -g  status-keys vi
set -g  status-interval 1

# Number windows and panes from 1
set -g  base-index 1
set -g  pane-base-index 1
set -g  renumber-windows on

# Terminal title
set -g  set-titles on
set -g  set-titles-string "#W - #T"

# --- Windows & panes ------------------------------------------------------------------------------
# New window next to the current one, in the same directory
bind t new-window -a -c "#{pane_current_path}"

# Split panes
bind - split-window -v
bind = split-window -h

# Move between panes: Alt + arrows / Alt + hjkl
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Switch windows: Shift + arrows / Alt + u,i
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n M-u     previous-window
bind -n M-i     next-window

# Type into all panes at once
bind S {
  set synchronize-panes
  display "Sync #{?synchronize-panes,ON,OFF}"
}

# --- Sessions -------------------------------------------------------------------------------------
# Session tree
bind s choose-session -Z

# Jump to any window with fzf
bind W display-popup -E "\
  tmux list-windows -a -F '#{session_name}:#{window_index}  #{window_name}' \
  | fzf --reverse | cut -d' ' -f1 | xargs -r tmux switch-client -t"

# --- Popups & tools -------------------------------------------------------------------------------
bind e display-popup -E -d "#{pane_current_path}" ranger
bind G display-popup -E -d "#{pane_current_path}" lazygit
bind N display-popup -E '${EDITOR:-vim} ~/NOTES.md'
bind m command-prompt -p "man:" "display-popup -E 'man %%'"

# System monitor: btop > htop > top
bind H display-popup -E '\
  if   command -v btop >/dev/null 2>&1; then exec btop; \
  elif command -v htop >/dev/null 2>&1; then exec htop; \
  else exec top; fi'

# Open the pane's scrollback in nvim (read-only)
bind y {
  capture-pane -S -5000 -b scrollback
  display-popup -E 'tmux show-buffer -b scrollback | ${EDITOR:-vim} -R -; tmux delete-buffer -b scrollback'
}

# Persistent floating terminal (press again to hide it)
bind '`' if-shell -F '#{==:#{session_name},scratch}' {
  detach-client
} {
  display-popup -E '\
    tmux has-session -t scratch 2>/dev/null || tmux new-session -d -s scratch; \
    tmux set-option -t scratch detach-on-destroy on; \
    tmux attach-session -t scratch'
}

# Floating opencode, one session per directory (press again to hide it)
bind O if-shell -F '#{m:opencode-*,#{session_name}}' {
  detach-client
} {
  display-popup -E -d '#{pane_current_path}' '\
    s="opencode-$(basename "$PWD" | tr ".:" "__")"; \
    tmux has-session -t "$s" 2>/dev/null || tmux new-session -d -s "$s" -c "$PWD" opencode; \
    tmux set-option -t "$s" detach-on-destroy on; \
    tmux set-option -t "$s" status off; \
    tmux attach-session -t "$s"'
}

# --- Menus ----------------------------------------------------------------------------------------
# Edit dotfiles
bind D display-menu -T '#[align=centre] Dotfiles ' -x C -y C \
  '.bashrc'    b { display-popup -E '${EDITOR:-vim} ~/.bashrc' } \
  '.tmux.conf' t { display-popup -E '${EDITOR:-vim} ~/.tmux.conf' } \
  '' \
  'Cancel'     q { }


bind M display-menu -T '#[align=centre] Toggles ' -x C -y C \
  'Mouse           #{?mouse,[on],[off]}'                                        m { set -g mouse } \
  'Sync panes      #{?synchronize-panes,[on],[off]}'                            y { set -w synchronize-panes } \
  'Status bar      #{?#{==:#{status},off},[off],[on]}'                          s { set -g status '#{?#{==:#{status},off},on,off}' } \
  'Status on top   #{?#{==:#{status-position},top},[on],[off]}'                 p { set -g status-position '#{?#{==:#{status-position},top},bottom,top}' } \
  'Pane titles     #{?#{==:#{pane-border-status},off},[off],[on]}'              t { set -g pane-border-status '#{?#{==:#{pane-border-status},off},top,off}' } \
  '' \
  'Cancel'                                                                      q { }

# Kill the whole process tree of each pane
set -g @kill-tree '
  tree() {
    kill -STOP "$1" 2>/dev/null
    echo "$1"
    for child in $(pgrep -P "$1"); do
      tree "$child"
    done
  }

  pids=$(
    tmux list-panes "$@" -F "#{pane_pid}" | while read -r pane; do
      tree "$pane"
    done
  )

  [ -n "$pids" ] || exit 0
  kill -KILL $pids 2>/dev/null
  true
'

bind k display-menu -T '#[align=centre] Kill ' -x C -y C \
  'Window'  w { run-shell "set -- -t '##{window_id}';      ##{@kill-tree}" } \
  'Session' s { run-shell "set -- -s -t '##{session_id}';  ##{@kill-tree}" } \
  'All'     9 { run-shell "set -- -a;                      ##{@kill-tree}" } \
  '' \
  'Cancel'  q { }

# --- Nested mode (F12) ----------------------------------------------------------------------------
# Disable every binding in this session to use tmux inside tmux.
bind -T root F12 {
  set prefix None
  set prefix2 None
  set key-table off
  set status-style "fg=colour245,bg=colour238"
  refresh-client -S
}

bind -T off F12 {
  set -u prefix
  set -u prefix2
  set -u key-table
  set -u status-style
  refresh-client -S
}

# --- Reload config --------------------------------------------------------------------------------
bind r {
  source-file ~/.tmux.conf
  display "Config reloaded!"
}

# --- Appearance -----------------------------------------------------------------------------------
# Color table, run this in a tmux pane to see all colors:
#   for i in {0..255}; do printf '\x1b[38;5;%dmcolour%d\x1b[0m\n' $i $i; done

# Status bar
# set -g status-position top
set -g status-style        fg=default,bg=default

set -g status-left-length  50
set -g status-right-length 50

set -g status-left  '#[fg=colour66,bg=default,reverse] #S #[default,fg=colour66] '
set -g status-right '#[fg=colour30,bg=default] #[fg=colour30,bg=default,reverse] #{b:socket_path} '
# set -g status-right '#[fg=colour195,bg=colour66,bold] %H:%M #[fg=colour195,bg=colour30,bold] %d.%m #[fg=colour195,bg=colour23,bold] #{b:socket_path} '


# Window tabs
set -g window-status-format         '#[fg=default,bg=default,dim] #I #W #{?window_flags,#F, }'
set -g window-status-current-format '#[bg=default,fg=colour23] #[fg=colour23,bg=default,bold,reverse] #I #W #{?window_flags,#F, } #[default,bg=default,fg=colour23] '
set -g window-status-separator      '#[fg=colour238]'

# Messages
set -g message-style         fg=colour23,bg=default,reverse
set -g message-command-style fg=colour23,bg=default,reverse

# Borders
set -g pane-active-border-style fg=colour37,bright
set -g popup-border-lines rounded
set -g menu-border-lines  rounded
